<!DOCTYPE html>
<!-- Página de Autenticación: Login y Registro con Firebase -->
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Iniciar Sesión | Emilio Espinoza</title>
    <meta
      name="description"
      content="Inicia sesión o regístrate en el portfolio de Emilio Espinoza"
    />
    <!-- Estilos del portfolio -->
    <link rel="stylesheet" href="style.css" />
    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Fira+Code:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <!-- Font Awesome para iconos -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
  </head>

  <body>
    <!-- Fondo con partículas animadas -->
    <div class="auth-bg">
      <div class="auth-particle"></div>
      <div class="auth-particle"></div>
      <div class="auth-particle"></div>
      <div class="auth-particle"></div>
      <div class="auth-particle"></div>
    </div>

    <!-- Contenedor principal de autenticación -->
    <div class="auth-container" id="auth-container">
      <!-- Enlace para volver al portfolio -->
      <a href="index.html" class="auth-back-link" id="auth-back-link">
        <i class="fas fa-arrow-left"></i> Volver al Portfolio
      </a>

      <!-- Tarjeta de autenticación con efecto glassmorphism -->
      <div class="auth-card" id="auth-card">
        <!-- Logo / Título -->
        <div class="auth-header">
          <h1 class="auth-logo">
            <span class="gradient-text">E</span>E
          </h1>
          <p class="auth-subtitle" id="auth-subtitle">
            Bienvenido de nuevo
          </p>
        </div>

        <!-- Pestañas Login / Registro -->
        <div class="auth-tabs" id="auth-tabs">
          <button
            class="auth-tab active"
            id="tab-login"
            data-tab="login"
            aria-label="Ir a Login"
          >
            Iniciar Sesión
          </button>
          <button
            class="auth-tab"
            id="tab-register"
            data-tab="register"
            aria-label="Ir a Registro"
          >
            Registrarse
          </button>
          <!-- Indicador animado debajo de la pestaña activa -->
          <div class="tab-indicator" id="tab-indicator"></div>
        </div>

        <!-- Mensaje de error/éxito -->
        <div class="auth-message" id="auth-message" role="alert"></div>

        <!-- ============================================ -->
        <!-- FORMULARIO DE LOGIN -->
        <!-- ============================================ -->
        <form class="auth-form" id="login-form">
          <div class="input-group" id="login-email-group">
            <label for="login-email">
              <i class="fas fa-envelope"></i> Correo electrónico
            </label>
            <input
              type="email"
              id="login-email"
              class="auth-input"
              placeholder="tu@email.com"
              required
              autocomplete="email"
            />
          </div>

          <div class="input-group" id="login-password-group">
            <label for="login-password">
              <i class="fas fa-lock"></i> Contraseña
            </label>
            <div class="password-wrapper">
              <input
                type="password"
                id="login-password"
                class="auth-input"
                placeholder="Tu contraseña"
                required
                autocomplete="current-password"
              />
              <button
                type="button"
                class="password-toggle"
                id="toggle-login-password"
                aria-label="Mostrar contraseña"
              >
                <i class="fas fa-eye"></i>
              </button>
            </div>
          </div>

          <button type="submit" class="auth-btn" id="login-btn">
            <span class="btn-text">Iniciar Sesión</span>
            <span class="btn-loader" id="login-loader"></span>
          </button>
        </form>

        <!-- ============================================ -->
        <!-- FORMULARIO DE REGISTRO -->
        <!-- ============================================ -->
        <form class="auth-form hidden" id="register-form">
          <div class="input-group" id="register-name-group">
            <label for="register-name">
              <i class="fas fa-user"></i> Nombre completo
            </label>
            <input
              type="text"
              id="register-name"
              class="auth-input"
              placeholder="Tu nombre"
              required
              autocomplete="name"
            />
          </div>

          <div class="input-group" id="register-email-group">
            <label for="register-email">
              <i class="fas fa-envelope"></i> Correo electrónico
            </label>
            <input
              type="email"
              id="register-email"
              class="auth-input"
              placeholder="tu@email.com"
              required
              autocomplete="email"
            />
          </div>

          <div class="input-group" id="register-password-group">
            <label for="register-password">
              <i class="fas fa-lock"></i> Contraseña
            </label>
            <div class="password-wrapper">
              <input
                type="password"
                id="register-password"
                class="auth-input"
                placeholder="Mínimo 6 caracteres"
                required
                minlength="6"
                autocomplete="new-password"
              />
              <button
                type="button"
                class="password-toggle"
                id="toggle-register-password"
                aria-label="Mostrar contraseña"
              >
                <i class="fas fa-eye"></i>
              </button>
            </div>
          </div>

          <div class="input-group" id="register-confirm-group">
            <label for="register-confirm">
              <i class="fas fa-shield-alt"></i> Confirmar contraseña
            </label>
            <div class="password-wrapper">
              <input
                type="password"
                id="register-confirm"
                class="auth-input"
                placeholder="Repite tu contraseña"
                required
                minlength="6"
                autocomplete="new-password"
              />
              <button
                type="button"
                class="password-toggle"
                id="toggle-register-confirm"
                aria-label="Mostrar contraseña"
              >
                <i class="fas fa-eye"></i>
              </button>
            </div>
          </div>

          <button type="submit" class="auth-btn" id="register-btn">
            <span class="btn-text">Crear Cuenta</span>
            <span class="btn-loader" id="register-loader"></span>
          </button>
        </form>

        <!-- Separador visual -->
        <div class="auth-divider">
          <span>o continúa con</span>
        </div>

        <!-- Botón de Login con Google -->
        <button class="google-btn" id="google-btn">
          <svg
            class="google-icon"
            viewBox="0 0 24 24"
            width="20"
            height="20"
          >
            <path
              fill="#4285F4"
              d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"
            />
            <path
              fill="#34A853"
              d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
            />
            <path
              fill="#FBBC05"
              d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"
            />
            <path
              fill="#EA4335"
              d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
            />
          </svg>
          <span>Google</span>
        </button>
      </div>
    </div>

    <!-- ============================================ -->
    <!-- Script de autenticación (módulo ES6) -->
    <!-- ============================================ -->
    <script type="module">
      // Importar funciones de Firebase desde nuestro módulo
      import {
        registerUser,
        loginUser,
        loginWithGoogle,
        onAuthChange,
      } from "./firebase-auth.js";

      // =============================================
      // REFERENCIAS A ELEMENTOS DEL DOM
      // =============================================
      const loginForm = document.getElementById("login-form");
      const registerForm = document.getElementById("register-form");
      const tabLogin = document.getElementById("tab-login");
      const tabRegister = document.getElementById("tab-register");
      const tabIndicator = document.getElementById("tab-indicator");
      const authMessage = document.getElementById("auth-message");
      const authSubtitle = document.getElementById("auth-subtitle");
      const googleBtn = document.getElementById("google-btn");
      const authCard = document.getElementById("auth-card");

      // =============================================
      // SISTEMA DE PESTAÑAS (Login ↔ Registro)
      // =============================================

      // Posicionar el indicador en la pestaña activa al cargar
      function positionIndicator(tab) {
        tabIndicator.style.width = tab.offsetWidth + "px";
        tabIndicator.style.left = tab.offsetLeft + "px";
      }
      // Inicializar posición
      positionIndicator(tabLogin);

      // Cambiar a la pestaña de Login
      tabLogin.addEventListener("click", () => {
        tabLogin.classList.add("active");
        tabRegister.classList.remove("active");
        loginForm.classList.remove("hidden");
        registerForm.classList.add("hidden");
        positionIndicator(tabLogin);
        authSubtitle.textContent = "Bienvenido de nuevo";
        clearMessage();
      });

      // Cambiar a la pestaña de Registro
      tabRegister.addEventListener("click", () => {
        tabRegister.classList.add("active");
        tabLogin.classList.remove("active");
        registerForm.classList.remove("hidden");
        loginForm.classList.add("hidden");
        positionIndicator(tabRegister);
        authSubtitle.textContent = "Crea tu cuenta";
        clearMessage();
      });

      // =============================================
      // MOSTRAR / OCULTAR CONTRASEÑA
      // =============================================
      document.querySelectorAll(".password-toggle").forEach((btn) => {
        btn.addEventListener("click", () => {
          const input = btn.previousElementSibling;
          const icon = btn.querySelector("i");
          if (input.type === "password") {
            input.type = "text";
            icon.classList.replace("fa-eye", "fa-eye-slash");
          } else {
            input.type = "password";
            icon.classList.replace("fa-eye-slash", "fa-eye");
          }
        });
      });

      // =============================================
      // MENSAJES DE ERROR / ÉXITO
      // =============================================
      function showMessage(text, type = "error") {
        authMessage.textContent = text;
        authMessage.className = `auth-message ${type}`;
        authMessage.style.display = "block";
        // Auto-ocultar después de 5 segundos
        setTimeout(() => clearMessage(), 5000);
      }

      function clearMessage() {
        authMessage.style.display = "none";
        authMessage.className = "auth-message";
        authMessage.textContent = "";
      }

      // =============================================
      // ESTADO DE CARGA (spinner en el botón)
      // =============================================
      function setLoading(button, loading) {
        if (loading) {
          button.classList.add("loading");
          button.disabled = true;
        } else {
          button.classList.remove("loading");
          button.disabled = false;
        }
      }

      // =============================================
      // ENVIAR FORMULARIO DE LOGIN
      // =============================================
      loginForm.addEventListener("submit", async (e) => {
        e.preventDefault(); // Evitar recarga de página
        clearMessage();

        const email = document.getElementById("login-email").value.trim();
        const password = document.getElementById("login-password").value;
        const btn = document.getElementById("login-btn");

        setLoading(btn, true);

        // Llamar a la función de login de Firebase
        const result = await loginUser(email, password);

        setLoading(btn, false);

        if (result.success) {
          showMessage("¡Sesión iniciada correctamente!", "success");
          // Redirigir al portfolio después de 1 segundo
          setTimeout(() => (window.location.href = "index.html"), 1000);
        } else {
          showMessage(result.error);
        }
      });

      // =============================================
      // ENVIAR FORMULARIO DE REGISTRO
      // =============================================
      registerForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        clearMessage();

        const name = document.getElementById("register-name").value.trim();
        const email = document.getElementById("register-email").value.trim();
        const password = document.getElementById("register-password").value;
        const confirm = document.getElementById("register-confirm").value;
        const btn = document.getElementById("register-btn");

        // Validar que las contraseñas coincidan
        if (password !== confirm) {
          showMessage("Las contraseñas no coinciden.");
          return;
        }

        // Validar longitud mínima
        if (password.length < 6) {
          showMessage("La contraseña debe tener al menos 6 caracteres.");
          return;
        }

        setLoading(btn, true);

        // Llamar a la función de registro de Firebase
        const result = await registerUser(name, email, password);

        setLoading(btn, false);

        if (result.success) {
          showMessage("¡Cuenta creada exitosamente!", "success");
          setTimeout(() => (window.location.href = "index.html"), 1000);
        } else {
          showMessage(result.error);
        }
      });

      // =============================================
      // LOGIN CON GOOGLE
      // =============================================
      googleBtn.addEventListener("click", async () => {
        clearMessage();
        setLoading(googleBtn, true);

        const result = await loginWithGoogle();

        setLoading(googleBtn, false);

        if (result.success) {
          showMessage("¡Sesión iniciada con Google!", "success");
          setTimeout(() => (window.location.href = "index.html"), 1000);
        } else {
          showMessage(result.error);
        }
      });

      // =============================================
      // VERIFICAR SI YA ESTÁ AUTENTICADO
      // Si el usuario ya tiene sesión, redirigir al portfolio
      // =============================================
      onAuthChange((user) => {
        if (user) {
          // Usuario ya logueado, redirigir
          window.location.href = "index.html";
        }
      });
    </script>

    <!-- Script para el tema (oscuro/claro) -->
    <script>
      // Reutilizar la lógica de tema del portfolio
      const storageKey = "theme-preference";
      const getColorPreference = () => {
        if (localStorage.getItem(storageKey)) {
          return localStorage.getItem(storageKey);
        }
        return window.matchMedia("(prefers-color-scheme: dark)").matches
          ? "dark"
          : "light";
      };
      const reflectPreference = () => {
        document.documentElement.setAttribute(
          "data-theme",
          getColorPreference()
        );
      };
      reflectPreference();
    </script>
  </body>
</html>
